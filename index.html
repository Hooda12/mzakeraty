ound:#fff0f2;color:#c52845;box-shadow:none}.lang{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px}.hero{background:linear-gradient(135deg,#1e1745 0%,#4e36a7 48%,#007f7b 120%);color:#fff;border-radius:28px;padding:28px;position:relative;overflow:hidden;box-shadow:var(--shadow);margin-bottom:18px}.hero:after{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:#ffffff18;left:-80px;top:-100px}.hero h2{font-size:30px;margin:0 0 8px}.hero p{max-width:650px;color:#e6e2ff;line-height:1.7;margin:0 0 18px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{background:#ffffff17;border:1px solid #ffffff24;padding:7px 10px;border-radius:99px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}.stat .bubble{position:absolute;left:-15px;top:-18px;width:75px;height:75px;border-radius:50%;background:#f0ecff}.stat .icon{position:relative;font-size:22px}.stat .num{font-size:29px;font-weight:900;margin-top:7px}.muted{color:var(--muted)}.section{margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sectionhead h2{margin:0;font-size:21px}.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.subject{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);transition:.2s;cursor:pointer}.subject:hover{transform:translateY(-4px);box-shadow:0 24px 55px #30236b18}.subjecttop{display:flex;justify-content:space-between;align-items:center}.subjecticon{font-size:33px;width:55px;height:55px;border-radius:18px;background:linear-gradient(135deg,#eeeaff,#e7fffb);display:grid;place-items:center}.subject h3{margin:14px 0 4px;font-size:18px}.subject small{color:var(--muted)}.progress{height:9px;background:#eff0f5;border-radius:99px;overflow:hidden;margin- ing:5px 9px;font-size:11px;font-weight:800}.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.authcard{width:min(450px,100%);background:#fff;border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow)}.authlogo{text-align:center;margin-bottom:18px}.authlogo .logo{margin:auto}.file{border:1px dashed #cfcbe9;background:#faf9ff;padding:14px;border-radius:14px}.rtl-en{direction:ltr;text-align:left}.hide{display:none!important}@media(max-width:1000px){.side{width:74px}.brand div:not(.logo){display:none}.brand{justify-content:center}.nav button{font-size:0;text-align:center}.nav .ico{font-size:20px}.main{margin-right:74px}.stats{grid-template-columns:repeat(2,1fr)}.subjects,.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.main{padding:14px}.stats,.subjects,.grid{grid-template-columns:1fr}.topbar{align-items:flex-start}.welcome h1{font-size:24px}.hero{padding:22px}.hero h2{font-size:25px}.actions .btn span{display:none}.lecture{align-items:flex-start}.badge{display:none}}

const cfg=window.MZAKERATY_CONFIG||{};const cloud=!!(cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY);const sb=cloud?supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY):null;const BUCKET='lecture-files';let user=null,profile=null,data={subjects:[],lectures:[],cards:[],questions:[]},lang=localStorage.mz_lang||'ar',page='home';
const T={ar:{dir:'rtl',brand:'مذاكرتي',sub:'منصتك للمذاكرة بذكاء',home:'الرئيسية',subjects:'المواد والمحاضرات',review:'المراجعة',quiz:'الاختبارات',search:'البحث',settings:'الإعدادات',hello:'أهلاً بيك 👋',hero:'ذاكر أقل… وافهم أكثر.',herop:'كل محاضراتك وملخصاتك وأسئلتك في مكان واحد. المنصة مصممة بحيث يكون المحتوى تحت إدارتك أنت، وزمايلك يذاكروا بأمان بدون صلاحية تعديل.',addSubject:'إضافة مادة',addLecture:'إضافة محاضرة',subjectsTitle:'موادك الدراسية',recent:'آخر المحاضرات',all:'عرض الكل',subjectsCount:'المواد',lecturesCount:'المحاضرات',mastered:'المتقن',progress:'متوسط التقدم',admin:'مالك المحتوى',student:'طالب',login:'دخول',signup:'إنشاء حساب',logout:'خروج',cloud:'سحابي',local:'وضع تجريبي',ownerOnly:'إدارة المحتوى متاحة للمالك فقط. الطلاب لديهم صلاحية القراءة والمذاكرة.',noData:'لسه مفيش محتوى هنا.',open:'فتح',edit:'تعديل',delete:'حذف',save:'حفظ',cancel:'إلغاء',nameAr:'اسم المادة بالعربي',nameEn:'Subject name in English',titleAr:'عنوان المحاضرة بالعربي',titleEn:'Lecture title in English',noteAr:'ملخص/ملاحظات بالعربي',noteEn:'Notes / summary in English',icon:'الأيقونة',file:'ملف المحاضرة',upload:'رفع وحفظ',status:'الحالة',not_started:'لم أبدأ',studied:'ذاكرتها',reviewStatus:'مراجعة',masteredStatus:'متقن',language:'اللغة',arabic:'العربية',english:'English',account:'الحساب',library:'مكتبة المحاضرات',signed:'مسجل دخول',setup:'اربط Supabase أولاً',adminSetup:'بعد إنشاء حسابك، اجعل حسابك Admin من SQL مرة واحدة.',searchHint:'ابحث عن مادة أو محاضرة أو كلمة في الملخص…',cards:'البطاقات',questions:'الأسئلة'},en:{dir:'ltr',brand:'Mzakeraty',sub:'Your smart study hub',home:'Home',subjects:'Subjects & Lectures',review:'Review',quiz:'Quizzes',search:'Search',settings:'Settings',hello:'Welcome back 👋',hero:'Study less… understand more.',herop:'All your lectures, notes and questions in one place. You control the library; classmates can study without editing your content.',addSubject:'Add subject',addLecture:'Add lecture',subjectsTitle:'Your subjects',recent:'Recent lectures',all:'View function tr(k){return T[lang][k]||k}function setLang(x){lang=x;localStorage.mz_lang=x;document.documentElement.lang=x;document.documentElement.dir=T[x].dir;render()}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function toast(s){const x=document.getElementById('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',2500)}function modal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function isAdmin(){return !!profile?.is_admin}function displayName(){return profile?.display_name||user?.email?.split('@')[0]||''}function titleOf(s){return lang==='ar'?(s.name_ar||s.name_en):(s.name_en||s.name_ar)}function lectureTitle(l){return lang==='ar'?(l.title_ar||l.title_en):(l.title_en||l.title_ar)}function noteOf(l){return lang==='ar'?(l.note_ar||l.note_en):(l.note_en||l.note_ar)}
async function init(){if(cloud){const {data:a}=await sb.auth.getSession();user=a.session?.user||null;if(user){await loadCloud()}sb.auth.onAuthStateChange(async(_e,s)=>{user=s?.user||null;if(user)await loadCloud();else{profile=null;data={subjects:[],lectures:[],cards:[],questions:[]};render()}})}else{data=JSON.parse(localStorage.getItem('mz_demo')||'null')||{subjects:[{id:'d1',name_ar:'علم المناعة',name_en:'Immunology',icon:'🧬'}],lectures:[{id:'l1',subject_id:'d1',title_ar:'المناعة الفطرية',title_en:'Innate Immunity',status:'studied',note_ar:'مراجعة أساسية',note_en:'Core review'}],cards:[],questions:[]};render()}}
async function loadCloud(){const [p,s,l,c,q]=await Promise.all([sb.from('profiles').select('*').eq('id',user.id).single(),sb.from('subjects').select('*').order('sort_order').order('created_at'),sb.from('lectures').select('*').order('sort_order').order('created_at'),sb.from('flashcards').select('*').eq('user_id',user.id).order('created_at'),sb.from('questions').select('*').eq('user_id',user.id).order('created_at')]);profile=p.data||{};data={subjects:s.data||[],lectures:l.data||[],cards:c.data||[],questions:q.data||[]};render( );}
function saveDemo(){localStorage.setItem('mz_demo',JSON.stringify(data))}async function dbInsert(table,row){const {data:r,error}=await sb.from(table).insert(row).select().single();if(error)throw error;return r}async function dbUpdate(table,id,row){const {data:r,error}=await sb.from(table).update(row).eq('id',id).select().single();if(error)throw error;return r}async function dbDelete(table,id){const {error}=await sb.from(table).delete().eq('id',id);if(error)throw error}
function shell(body){document.getElementById('root').innerHTML=`<aside class="side"><div class="brand"><div class="logo">📚</div><div><b>${tr('brand')}</b><small>${tr('sub')}</small></div></div><nav class="nav"><button class="${page==='home'?'active':''}" onclick="go('home')"><span class="ico">🏠</span>${tr('home')}</button><button class="${page==='subjects'?'active':''}" onclick="go('subjects')"><span class="ico">📚</span>${tr('subjects')}</button><button class="${page==='review'?'active':''}" onclick="go('review')"><span class="ico">🧠</span>${tr('review')}</button><button class="${page==='quiz'?'active':''}" onclick="go('quiz')"><span class="ico">❓</span>${tr('quiz')}</button><button class="${page==='search'?'active':''}" onclick="go('search')"><span class="ico">🔎</span>${tr('search')}</button><button class="${page==='settings'?'active':''}" onclick="go('settings')"><span class="ico">⚙️</span>${tr('settings')}</button></nav></aside><main class="main">${body}</main>`}
function top(title,sub=''){return `<div class="topbar"><div class="welcome"><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="actions"><select class="lang" onchange="setLang(this.value)"><option value="ar" ${lang==='ar'?'selected':''}>العربية</option><option value="en" ${lang==='en'?'selected':''}>English</option></select>${user?`<button class="btn alt" onclick="logout()">${tr('logout')}</button>`:`<button class="btn" onclick="auth()">${tr('login')}</button>`}</div></div>`}
function home(){const total=data.lectures.length,master=data.lectures.filter(x=>x.status==='mastered').length,avg=total?Math.round(data.lectures.reduce((a,l)=>a+({not_started:0,studied:55,review:78,mastered:100}[l.status]||0),0)/total):0;const recent=data.lectures.slice(-5).reverse();shell(top(`${tr('hello')} ${esc(displayName())}`,`${isAdmin()?tr('admin'):tr('student')} · ${cloud?tr('cloud'):tr('local')}`)+`<section class="hero"><h2>${tr('hero')}</h2><p>${tr('herop')}</p><div class="chips"><span class="chip">🔐 ${isAdmin()?tr('admin'):tr('ownerOnly')}</span><span class="chip">🌍 عربي + English</span><span class="chip">☁️ ${cloud?tr('cloud'):tr('local')}</span></div></section><div class="stats"><div class="stat"><div class="bubble"></div><div class="icon">📚</div><div class="num">${data.subjects.length}</div><div class="muted">${tr('subjectsCount')}</div></div><div class="stat"><div class="bubble"></div><div class="icon">📄</div><div class="num">${total}</div><div class="muted">${tr('lecturesCount')}</div></div><div class="stat"><div class="bubble"></div><div class="icon">🏆</div><div class="num">${master}</div><div class="muted">${tr('mastered')}</div></div><div class="stat"><div class="bubble"></div><div class="icon">📈</div><div class="num">${avg}%</div><div class="muted">${tr('progress')}</div></div></div><section class="section"><div class="sectionhead"><h2>${tr('subjectsTitle')}</h2>${isAdmin()?`<button class="btn" onclick="addSubject()">＋ ${tr('addSubject')}</button>`:''}</div>${data.subjects.length?`<div class="subjects">${data.subjects.map(subjectCard).join('')}</div>`:`<div class="empty">${tr('noData')}${isAdmin()?`<div style="margin-top:14px"><button class="btn" onclick="addSubject()">＋ ${tr('addSubject')}</button></div>`:''}</div>`}</section><section class="section"><div class="sectionhead"><h2>${tr('recent')}</h2><button class="btn alt" onclick="go('subjects')">${tr('all')}</button></div>${recent.length?`<div class="list">${recent.map(lectureRow).join('')}</div>`:`<div class="empty">${tr('noData')}</div>`}</section>` );}
function subjectCard(s){const ls=data.lectures.filter(l=>l.subject_id===s.id),pct=ls.length?Math.round(ls.reduce((a,l)=>a+({not_started:0,studied:55,review:78,mastered:100}[l.status]||0),0)/ls.length):0;return `<div class="subject" onclick="openSubject('${s.id}')"><div class="subjecttop"><div class="subjecticon">${esc(s.icon||'📚')}</div><span class="adminmark">${ls.length} 📄</span></div><h3>${esc(titleOf(s))}</h3><small>${lang==='ar'?esc(s.name_en||''):esc(s.name_ar||'')}</small><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="pct">${pct}%</div></div>`}
function lectureRow(l){return `<div class="lecture"><div class="nbox">📄</div><div class="grow"><h4>${esc(lectureTitle(l))}</h4><small>${esc(data.subjects.find(s=>s.id===l.subject_id)?.[lang==='ar'?'name_ar':'name_en']||'')} · ${esc(noteOf(l)).slice(0,100)}</small></div><span class="badge">${tr(l.status)}</span><button class="btn alt" onclick="openLecture('${l.id}')">${tr('open')}</button></div>`}
function subjects(){let cards=data.subjects.length?'<div class="subjects">'+data.subjects.map(subjectCard).join('')+'</div>':'<div class="empty">'+tr('noData')+'</div>';let add=isAdmin()?'<button class="btn" onclick="addSubject()">＋ '+tr('addSubject')+'</button>':'<span class="adminmark">🔒 '+tr('student')+'</span>';shell(top(tr('subjects'),tr('library'))+'<div class="sectionhead"><h2>'+tr('subjectsTitle')+'</h2>'+add+'</div>'+cards)}
function openSubject(id){const s=data.subjects.find(x=>x.id===id),ls=data.lectures.filter(l=>l.subject_id===id);shell(top(esc(titleOf(s)),lang==='ar'?esc(s.name_en||''):esc(s.name_ar||''))+`<div class="sectionhead"><h2>📚 ${tr('library')}</h2>${isAdmin()?`<div class="row"><button class="btn" onclick="addLecture('${id}')">＋ ${tr('addLecture')}</button><button class="btn alt" onclick="editSubject('${id}')">${tr('edit')}</button><button class="btn danger" onclick="deleteSubject('${id}')">${tr('delete')}</button></div>`:''}</div>${!isAdmin()?`<div class="lock">🔐 ${tr('ownerOnly')}</div>`:''}<div class="section">${ls.length?`<div class="list">${ls.map(lectureRow).join('')}</div>`:`<div class="empty">${tr('noData')}</div>`}</div>` );}
function addSubject(existing){if(!isAdmin())return toast(tr('ownerOnly'));const s=existing?data.subjects.find(x=>x.id===existing):null;modal(`<button class="close" onclick="closeModal()">✕</button><h2>${s?tr('edit'):tr('addSubject')}</h2><div class="form"><input id="sa" placeholder="${tr('nameAr')}" value="${esc(s?.name_ar||'')}"><input id="se" placeholder="${tr('nameEn')}" value="${esc(s?.name_en||'')}"><input id="si" placeholder="${tr('icon')}" value="${esc(s?.icon||'📚')}"><div class="row"><button class="btn" onclick="saveSubject('${existing||''}')">${tr('save')}</button><button class="btn alt" onclick="closeModal()">${tr('cancel')}</button></div></div>`)}
async function saveSubject(id){if(!isAdmin())return;try{const row={name_ar:sa.value.trim(),name_en:se.value.trim(),icon:si.value.trim()||'📚',user_id:user.id};if(!row.name_ar)return toast(tr('nameAr'));if(cloud){if(id){const r=await dbUpdate('subjects',id,row);Object.assign(data.subjects.find(x=>x.id===id),r)}else data.subjects.push(await dbInsert('subjects',row))}else{if(id)Object.assign(data.subjects.find(x=>x.id===id),row);else data.subjects.push({...row,id:crypto.randomUUID()});saveDemo()}closeModal();subjects();toast('✓')}catch(e){toast(e.message)}}
function editSubject(id){addSubject(id)}
async function deleteSubject(id){if(!isAdmin()||!confirm(tr('delete')+'?'))return;try{if(cloud)await dbDelete('subjects',id);else{data.subjects=data.subjects.filter(x=>x.id!==id);data.lectures=data.lectures.filter(x=>x.subject_id!==id);saveDemo()}data.subjects=data.subjects.filter(x=>x.id!==id);data.lectures=data.lectures.filter(x=>x.subject_id!==id);subjects();toast('✓')}catch(e){toast(e.message)}}
function addLecture(sid,lid){if(!isAdmin())return toast(tr('ownerOnly'));const l=lid?data.lectures.find(x=>x.id===lid):null;modal(`<button class="close" onclick="closeModal()">✕</button><h2>${l?tr('edit'):tr('addLecture')}</h2><div class="form"><input id="ta" placeholder="${tr('titleAr')}" value="${esc(l?.title_ar||'')}"><input id="te" placeholder="${tr('titleEn')}" value="${esc(l?.title_en||'')}"><textarea id="na" placeholder="${tr('noteAr')}">${esc(l?.note_ar||'')}</textarea><textarea id="ne" placeholder="${tr('noteEn')}">${esc(l?.note_en||'')}</textarea><select id="st"><option value="not_started">${tr('not_started')}</option><option value="studied">${tr('studied')}</option><option value="review">${tr('reviewStatus')}</option><option value="mastered">${tr('masteredStatus')}</option></select><div class="file"><b>📎 ${tr('file')}</b><input id="lf" type="file" accept=".pdf,.ppt,.pptx,.doc,.docx,.txt"></div><button class="btn" onclick="saveLecture('${sid}','${lid||''}')">${tr('upload')}</button></div>`)}
async function saveLecture(sid,lid){if(!isAdmin())return;try{let row={subject_id:sid,user_id:user.id,title_ar:ta.value.trim(),title_en:te.value.trim(),note_ar:na.value,note_en:ne.value,status:st.value};if(!row.title_ar)return toast(tr('titleAr'));let old=lid?data.lectures.find(x=>x.id===lid):null;if(cloud){let r=lid?await dbUpdate('lectures',lid,row):await dbInsert('lectures',row);if(lf.files[0]){const f=lf.files[0],path=user.id+'/'+r.id+'_'+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await sb.storage.from(BUCKET).upload(path,f,{upsert:false,contentType:f.type||'application/octet-stream'});if(up.error)throw up.error;r=await dbUpdate('lectures',r.id,{file_path:path,file_name:f.name})}if(lid)Object.assign(old,r);else data.lectures.push(r)}else{if(lid)Object.assign(old,row);else data.lectures.push({...row,id:crypto.randomUUID(),file_name:lf.files[0]?.name||''});saveDemo()}closeModal();openSubject(sid);toast('✓')}catch(e){toast(e.message)}}
function openLecture(id){const l=data.lectures.find(x=>x.id===id);const s=data.subjects.find(x=>x.id===l.subject_id);modal(`<button class="close" onclick="closeModal()">✕</button><h2>📄 ${esc(lectureTitle(l))}</h2><p class="muted">${esc(titleOf(s))}</p><div class="card" style="box-shadow:none;background:#fafaff"><h3>${tr('noteAr')}</h3><p style="line-height:1.9">${esc(noteOf(l)||tr('noData'))}</p></div>${l.file_path?`<button class="btn" onclick="downloadFile('${esc(l.file_path)}')">📎 ${esc(l.file_name||tr('file'))}</button>`:''}${isAdmin()?`<div class="row" style="margin-top:15px"><button class="btn alt" onclick="closeModal();addLecture('${s.id}','${l.id}')">${tr('edit')}</button><button class="btn danger" onclick="deleteLecture('${l.id}','${s.id}')">${tr('delete')}</button></div>`:''}`)}
async function downloadFile(path){if(!cloud)return toast('Cloud only');const {data:r,error}=await sb.storage.from(BUCKET).createSignedUrl(path,120);if(error)return toast(error.message);window.open(r.signedUrl,'_blank')}
async function deleteLecture(id,sid){if(!isAdmin()||!confirm(tr('delete')+'?'))return;try{if(cloud){const l=data.lectures.find(x=>x.id===id);if(l?.file_path)await sb.storage.from(BUCKET).remove([l.file_path]);await dbDelete('lectures',id)}data.lectures=data.lectures.filter(x=>x.id!==id);if(!cloud)saveDemo();closeModal();openSubject(sid);toast('✓')}catch(e){toast(e.message)}}
function review(){shell(top('🧠 '+tr('review'),tr('cards'))+`<div class="card"><h2>${tr('cards')}</h2><p class="muted">${data.cards.length} ${tr('cards')}</p>${!data.cards.length?`<div class="empty">${tr('noData')}</div>`:`<div class="grid">${data.cards.map(c=>`<div class="card"><b>${esc(lang==='ar'?c.front_ar:c.front_en||c.front_ar)}</b><hr><span class="muted">${esc(lang==='ar'?c.back_ar:c.back_en||c.back_ar)}</span></div>`).join('')}</div>`}</div>` );}
function quiz(){shell(top('❓ '+tr('quiz'),tr('questions'))+`<div class="card"><h2>${tr('questions')}</h2><p class="muted">${data.questions.length}</p>${data.questions.length?data.questions.map(q=>`<div class="lecture"><div class="nbox">?</div><div class="grow"><b>${esc(lang==='ar'?q.question_ar:q.question_en||q.question_ar)}</b></div></div>`).join(''):`<div class="empty">${tr('noData')}</div>`}</div>` );}
function searchPage(){shell(top('🔎 '+tr('search'),tr('searchHint'))+`<input id="sq" class="search" placeholder="${tr('searchHint')}" oninput="doSearch(this.value)"><div id="results" class="section"></div>`);doSearch('')}function doSearch(q){q=q.toLowerCase();const a=data.lectures.filter(l=>[l.title_ar,l.title_en,l.note_ar,l.note_en].join(' ').toLowerCase().includes(q));document.getElementById('results').innerHTML=a.length?a.map(lectureRow).join(''):`<div class="empty">${tr('noData')}</div>`}
function settings(){shell(top('⚙️ '+tr('settings'),tr('account'))+`<div class="grid"><div class="card"><h2>☁️ ${tr('account')}</h2><p>${user?esc(user.email):tr('local')}</p><p>${isAdmin()?`<span class="adminmark">👑 ${tr('admin')}</span>`:`<span class="adminmark">👤 ${tr('student')}</span>`}</p>${user?`<button class="btn" onclick="logout()">${tr('logout')}</button>`:`<button class="btn" onclick="auth()">${tr('login')}</button>`}</div><div class="card"><h2>🌍 ${tr('language')}</h2><button class="btn alt" onclick="setLang('ar')">العربية</button> <button class="btn alt" onclick="setLang('en')">English</button></div><div class="card"><h2>🔐 ${tr('admin')}</h2><p class="muted">${tr('adminSetup')}</p></div></div>` );}
function auth(){if(!cloud)return modal(`<button class="close" onclick="closeModal()">✕</button><div class="lock">${tr('setup')}</div>`);modal(`<button class="close" onclick="closeModal()">✕</button><h2>${tr('login')} / ${tr('signup')}</h2><div class="form"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="btn" onclick="login()">${tr('login')}</button><button class="btn alt" onclick="signup()">${tr('signup')}</button></div>`)}async function login(){const r=await sb.auth.signInWithPassword({email:em.value,password:pw.value});if(r.error)return toast(r.error.message);closeModal();toast('✓')}async function signup(){const r=await sb.auth.signUp({email:em.value,password:pw.value});if(r.error)return toast(r.error.message);closeModal();toast(r.data.session?'✓':'Check your email')}async function logout(){await sb.auth.signOut();toast('✓' );}
function render(){go(page );}
function go(x){page=x;if(x==='home')home();else if(x==='subjects')subjects();else if(x==='review')review();else if(x==='quiz')quiz();else if(x==='search')searchPage();else settings()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});init();
</script><footer class="brand-footer" aria-label="Credits">Built &amp; Crafted by <strong>loca_tove</strong></footer><style>.brand-footer{margin:32px 0 18px;text-align:center;color:var(--muted,#8b8fa8);font-size:13px;letter-spacing:.2px}.brand-footer strong{color:var(--primary,#6c4cff);font-weight:800}</style></body></html>
