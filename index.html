<style>
:root{--p:#6c4cff;--p2:#00a99d;--ink:#17172b;--muted:#74758a;--bg:#f6f7fc;--card:#fff;--line:#e7e7f0;--danger:#c62845}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#efe9ff 0,transparent 28%),radial-gradient(circle at 90% 10%,#dcfff9 0,transparent 25%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.hide{display:none!important}.side{position:fixed;right:0;top:0;bottom:0;width:255px;background:#ffffffea;backdrop-filter:blur(16px);border-left:1px solid var(--line);padding:18px 14px;z-index:5}.brand{display:flex;gap:10px;align-items:center;padding:8px 10px 22px}.logo{width:45px;height:45px;border-radius:15px;background:linear-gradient(135deg,var(--p),#ff5ea8);display:grid;place-items:center;color:#fff;font-size:23px}.brand b{font-size:21px}.brand small{display:block;color:var(--muted);font-size:11px}.nav button{width:100%;border:0;background:transparent;text-align:right;padding:12px;border-radius:13px;color:#5d5e72;margin:3px 0;font-weight:700}.nav button.active,.nav button:hover{background:#f0edff;color:var(--p)}.main{margin-right:255px;padding:25px;max-width:1450px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.top h1{margin:0;font-size:28px}.top p{margin:5px 0 0;color:var(--muted)}.actions,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:12px;padding:10px 14px;background:linear-gradient(135deg,var(--p),#8a5cff);color:#fff;font-weight:800}.btn.alt{background:#fff;color:var(--p);border:1px solid #ddd9f1}.btn.danger{background:#fff0f2;color:var(--danger)}.lang{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px}.hero{background:linear-gradient(135deg,#1e1745,#4e36a7,#007f7b);color:#fff;border-radius:26px;padding:26px;margin-bottom:18px}.hero h2{margin:0 0 8px;font-size:29px}.hero p{margin:0 0 17px;line-height:1.8;color:#e9e5ff}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 10px;border:1px solid #ffffff2d;border-radius:99px;background:#ffffff18;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.stat,.card,.subject,.lecture{background:#fff;border:1px solid var(--line);border-radius:19px;box-shadow:0 12px 35px #30236b10}.stat{padding:17px}.stat .num{font-size:28px;font-weight:900;margin-top:5px}.muted{color:var(--muted)}.section{margin-top:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.sectionhead h2{margin:0;font-size:20px}.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.subject{padding:17px;cursor:pointer}.subject:hover{transform:translateY(-2px)}.subjecttop{display:flex;justify-content:space-between;align-items:center}.subjecticon{width:54px;height:54px;border-radius:17px;background:#eeeaff;display:grid;place-items:center;font-size:30px}.subject h3{margin:13px 0 4px}.progress{height:8px;background:#eeeef5;border-radius:99px;overflow:hidden;margin-top:14px}.bar{height:100%;background:linear-gradient(90deg,var(--p),#ff5ea8)}.pct{font-size:12px;color:var(--p);font-weight:800;margin-top:6px}.list{display:grid;gap:9px}.lecture{display:flex;align-items:center;gap:11px;padding:12px}.nbox{width:40px;height:40px;border-radius:12px;background:#f0edff;display:grid;place-items:center}.grow{flex:1}.lecture h4{margin:0 0 4px}.lecture small{color:var(--muted)}.badge{font-size:11px;background:#ecfbf6;color:#087b64;border-radius:99px;padding:6px 9px}.empty{padding:45px;text-align:center;background:#fff;border:1px dashed #d7d7e5;border-radius:18px;color:var(--muted)}.search{width:min(650px,100%);padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}.form{display:grid;gap:10px}.form input,.form textarea,.form select{width:100%;padding:11px;border:1px solid #dddde8;border-radius:11px;background:#fff}.form textarea{min-height:120px;resize:vertical}.modal{position:fixed;inset:0;background:#14122699;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.open{display:flex}.modalbox{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:23px;padding:21px}.close{float:left;border:0;background:#f2f2f7;border-radius:9px;padding:6px 10px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authcard{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:27px;padding:28px;box-shadow:0 25px 70px #30236b16}.authcard h1{text-align:center;margin:10px 0}.authcard p{text-align:center;color:var(--muted)}.toast{position:fixed;left:18px;bottom:18px;background:#19172d;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:50}.admin{color:var(--p);background:#eeeaff;border-radius:99px;padding:5px 9px;font-size:11px;font-weight:800}@media(max-width:900px){.side{width:70px}.brand div:not(.logo){display:none}.brand{justify-content:center}.nav button{font-size:0;text-align:center}.nav button:first-letter{font-size:20px}.main{margin-right:70px}.stats{grid-template-columns:repeat(2,1fr)}.subjects{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.main{padding:13px}.stats,.subjects{grid-template-columns:1fr}.top{align-items:flex-start}.top h1{font-size:23px}.hero{padding:21px}.hero h2{font-size:24px}.lecture{align-items:flex-start}.badge{display:none}}
</style>

<script>
function bootErr(m){const b=document.getElementById('boot');if(b)b.innerHTML='Error: '+String(m).replace(/</g,'&lt;')}
window.addEventListener('error',e=>bootErr(e.message));
window.addEventListener('unhandledrejection',e=>bootErr(e.reason&&e.reason.message||e.reason));
const cfg=window.MZAKERATY_CONFIG||{};
let sb=null,cfgError='';
try{if(cfg.SUPABASE_URL&&cfg.SUPABASE_ANON_KEY&&window.supabase)sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY)}catch(e){cfgError=e.message;console.error(e)}
const cloud=Boolean(sb);
const BUCKET='lecture-files';
let user=null,profile=null,page='home',lang=localStorage.getItem('mz_lang')||'ar';
let data={subjects:[],lectures:[],cards:[],questions:[]};
const tr={

},

}
};const t=k=>tr[lang][k]||k;
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function toast(s){const x=document.getElementById('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',2500)}
function modal(html){document.getElementById('modalbox').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeModal()};
function isAdmin(){return Boolean(profile&&profile.is_admin)}
function nameOf(s){return lang==='ar'?(s.name_ar||s.name_en):(s.name_en||s.name_ar)}
function lecName(l){return lang==='ar'?(l.title_ar||l.title_en):(l.title_en||l.title_ar)}
function noteOf(l){return lang==='ar'?(l.note_ar||l.note_en):(l.note_en||l.note_ar)}
async function init(){
  if(!cloud){
    renderAuth(cfgError?('خطأ في إعدادات Supabase: '+cfgError):(window.supabase?'ملف config.js ناقص أو غير صحيح':'تعذر تحميل مكتبة Supabase'));
    return;
  }
  try{
    const {data:a,error}=await Promise.race([sb.auth.getSession(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('انتهت مهلة الاتصال بـ Supabase')),8000))]);
    if(error) throw error;
    user=a.session?.user||null;
    if(user) await loadCloud();
    else { profile=null; data={subjects:[],lectures:[],cards:[],questions:[]}; renderAuth(); }
  }catch(e){
    console.error(e);
    profile=null; user=null; data={subjects:[],lectures:[],cards:[],questions:[]};
    renderAuth();
  }
  sb.auth.onAuthStateChange(async(_e,s)=>{
    user=s?.user||null;
    if(user) await loadCloud();
    else { profile=null; data={subjects:[],lectures:[],cards:[],questions:[]}; renderAuth(); }
  });
}


async function loginFromScreen(){
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  if(!email||!password) return toast(lang==='ar'?'اكتب البريد الإلكتروني وكلمة المرور':'Enter email and password');
  if(!sb) return toast('Supabase is not configured');
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error) toast(error.message);
}
async function signupFromScreen(){
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  const name=document.getElementById('authName').value.trim();
  if(!email||!password) return toast(lang==='ar'?'اكتب البريد الإلكتروني وكلمة المرور':'Enter email and password');
  if(!sb) return toast('Supabase is not configured');
  const {data:a,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});
  if(error) toast(error.message);
  else toast(a.session?(lang==='ar'?'تم إنشاء الحساب ✓':'Account created ✓'):(lang==='ar'?'تم إنشاء الحساب، راجع بريدك لتأكيد الحساب':'Account created; check your email to confirm'));
}
async function loadCloud(){
 try{const [p,s,l,c,q]=await Promise.all([sb.from('profiles').select('*').eq('id',user.id).maybeSingle(),sb.from('subjects').select('*').order('sort_order').order('created_at'),sb.from('lectures').select('*').order('sort_order').order('created_at'),sb.from('flashcards').select('*').eq('user_id',user.id).order('created_at'),sb.from('questions').select('*').eq('user_id',user.id).order('created_at')]);
 if(p.error)throw p.error; if(s.error)throw s.error; if(l.error)throw l.error; profile=p.data||{};data={subjects:s.data||[],lectures:l.data||[],cards:c.data||[],questions:q.data||[]};render();
 }catch(e){console.error(e);toast('حدث خطأ في تحميل البيانات: '+(e.message||e));renderAuth('تعذر تحميل البيانات من Supabase');}
}
function renderAuth(msg=''){
 document.getElementById('root').innerHTML='<div class="auth"><div class="authcard"><div class="logo" style="margin:auto">📚</div><h1>'+t('brand')+'</h1><p>'+t('sub')+'</p>'+ (msg?'<div style="background:#fff0f2;padding:10px;border-radius:10px">'+esc(msg)+'</div>':'') +'<div class="form" style="margin-top:18px"><input id="authName" placeholder="'+t('display')+'"><input id="authEmail" type="email" placeholder="'+t('email')+'"><input id="authPass" type="password" placeholder="'+t('password')+'"><div class="row"><button class="btn" onclick="signIn()">'+t('signIn')+'</button><button class="btn alt" onclick="signUp()">'+t('create')+'</button></div><button class="btn alt" onclick="toggleLang()">'+(lang==='ar'?'English':'العربية')+'</button></div></div></div>';
}
async function signIn(){const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPass').value;if(!email||!password)return toast('اكتب البريد وكلمة المرور');const {error}=await sb.auth.signInWithPassword({email,password});if(error)toast(error.message)}
async function signUp(){const email=document.getElementById('authEmail').value.trim(),password=document.getElementById('authPass').value,name=document.getElementById('authName').value.trim();if(!email||!password)return toast('اكتب البريد وكلمة المرور');const {error}=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});if(error)toast(error.message);else toast('تم إنشاء الحساب. لو طلب تأكيد البريد أكده ثم سجل دخول.')}
async function logout(){if(sb)await sb.auth.signOut()}
function toggleLang(){lang=lang==='ar'?'en':'ar';localStorage.setItem('mz_lang',lang);document.documentElement.lang=lang;document.documentElement.dir=tr[lang]? (lang==='ar'?'rtl':'ltr'):'rtl';if(user)render();else renderAuth()}
function shell(body){document.getElementById('root').innerHTML='<aside class="side"><div class="brand"><div class="logo">📚</div><div><b>'+t('brand')+'</b><small>'+t('sub')+'</small></div></div><nav class="nav"><button class="'+(page==='home'?'active':'')+'" onclick="go(\'home\')">🏠 '+t('home')+'</button><button class="'+(page==='subjects'?'active':'')+'" onclick="go(\'subjects\')">📚 '+t('subjects')+'</button><button class="'+(page==='review'?'active':'')+'" onclick="go(\'review\')">🧠 '+t('review')+'</button><button class="'+(page==='quiz'?'active':'')+'" onclick="go(\'quiz\')">❓ '+t('quiz')+'</button><button class="'+(page==='search'?'active':'')+'" onclick="go(\'search\')">🔎 '+t('search')+'</button><button class="'+(page==='settings'?'active':'')+'" onclick="go(\'settings\')">⚙️ '+t('account')+'</button></nav></aside><main class="main">'+body+'</main>'}
function top(title,sub=''){return '<div class="top"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="actions"><button class="btn alt" onclick="toggleLang()">'+(lang==='ar'?'English':'العربية')+'</button><button class="btn alt" onclick="logout()">'+t('logout')+'</button></div></div>'}
function subjectCard(s){const ls=data.lectures.filter(l=>l.subject_id===s.id),pct=ls.length?Math.round(ls.reduce((a,l)=>a+({not_started:0,studied:55,review:78,mastered:100}[l.status]||0),0)/ls.length):0;return '<div class="subject" onclick="openSubject(\''+s.id+'\')"><div class="subjecttop"><div class="subjecticon">'+esc(s.icon||'📚')+'</div><span class="admin">'+ls.length+' 📄</span></div><h3>'+esc(nameOf(s))+'</h3><small class="muted">'+esc(lang==='ar'?(s.name_en||''):(s.name_ar||''))+'</small><div class="progress"><div class="bar" style="width:'+pct+'%"></div></div><div class="pct">'+pct+'%</div></div>'}
function lectureRow(l){return '<div class="lecture"><div class="nbox">📄</div><div class="grow"><h4>'+esc(lecName(l))+'</h4><small>'+esc(noteOf(l)||'')+'</small></div><span class="badge">'+t(l.status||'not_started')+'</span><button class="btn alt" onclick="openLecture(\''+l.id+'\')">'+t('open')+'</button></div>'}
function home(){const total=data.lectures.length,master=data.lectures.filter(x=>x.status==='mastered').length,avg=total?Math.round(data.lectures.reduce((a,l)=>a+({not_started:0,studied:55,review:78,mastered:100}[l.status]||0),0)/total):0;const recent=data.lectures.slice(-5).reverse();shell(top(t('hello')+' '+esc(profile?.display_name||user?.email?.split('@')[0]||''),(isAdmin()?t('admin'):t('student'))+' · '+(cloud?t('cloud'):t('local')))+'<section class="hero"><h2>'+t('hero')+'</h2><p>'+t('herop')+'</p><div class="chips"><span class="chip">🔐 '+(isAdmin()?t('admin'):t('student'))+'</span><span class="chip">☁️ '+t('cloud')+'</span></div></section><div class="stats"><div class="stat"><div>📚</div><div class="num">'+data.subjects.length+'</div><div class="muted">'+t('subjectsCount')+'</div></div><div class="stat"><div>📄</div><div class="num">'+total+'</div><div class="muted">'+t('lecturesCount')+'</div></div><div class="stat"><div>🏆</div><div class="num">'+master+'</div><div class="muted">'+t('mastered')+'</div></div><div class="stat"><div>📈</div><div class="num">'+avg+'%</div><div class="muted">'+t('progress')+'</div></div></div><section class="section"><div class="sectionhead"><h2>'+t('subjectsTitle')+'</h2>'+(isAdmin()?'<button class="btn" onclick="addSubject()">＋ '+t('addSubject')+'</button>':'')+'</div>'+(data.subjects.length?'<div class="subjects">'+data.subjects.map(subjectCard).join('')+'</div>':'<div class="empty">'+t('noData')+'</div>')+'</section><section class="section"><div class="sectionhead"><h2>'+t('recent')+'</h2></div>'+(recent.length?'<div class="list">'+recent.map(lectureRow).join('')+'</div>':'<div class="empty">'+t('noData')+'</div>')+'</section>')}
function subjects(){shell(top(t('subjects'),t('library'))+'<div class="sectionhead"><h2>'+t('subjectsTitle')+'</h2>'+(isAdmin()?'<button class="btn" onclick="addSubject()">＋ '+t('addSubject')+'</button>':'')+'</div>'+(data.subjects.length?'<div class="subjects">'+data.subjects.map(subjectCard).join('')+'</div>':'<div class="empty">'+t('noData')+'</div>'))}
function openSubject(id){const s=data.subjects.find(x=>x.id===id);if(!s)return;const ls=data.lectures.filter(l=>l.subject_id===id);shell(top(esc(nameOf(s)),t('library'))+'<div class="sectionhead"><h2>'+t('lecturesCount')+'</h2>'+(isAdmin()?'<div class="row"><button class="btn" onclick="addLecture(\''+id+'\')">＋ '+t('addLecture')+'</button><button class="btn danger" onclick="deleteSubject(\''+id+'\')">'+t('delete')+'</button></div>':'')+'</div>'+(ls.length?'<div class="list">'+ls.map(lectureRow).join('')+'</div>':'<div class="empty">'+t('noData')+'</div>')+'<div style="margin-top:15px"><button class="btn alt" onclick="go(\'subjects\')">← '+t('all')+'</button></div>')}
function openLecture(id){const l=data.lectures.find(x=>x.id===id);if(!l)return;const s=data.subjects.find(x=>x.id===l.subject_id);modal('<button class="close" onclick="closeModal()">×</button><h2>'+esc(lecName(l))+'</h2><p class="muted">'+esc(nameOf(s||{}))+'</p><div class="card" style="box-shadow:none;margin-top:12px"><h3>'+t('noteAr')+'</h3><p style="white-space:pre-wrap;line-height:1.8">'+esc(noteOf(l)||'')+'</p></div>'+(l.file_path?'<div style="margin-top:15px"><button class="btn" onclick="downloadFile(\''+l.file_path+'\')">📥 فتح ملف المحاضرة</button></div>':'')+(isAdmin()?'<div class="row" style="margin-top:15px"><button class="btn alt" onclick="closeModal();editLecture(\''+id+'\')">'+t('edit')+'</button><button class="btn danger" onclick="deleteLecture(\''+id+'\')">'+t('delete')+'</button></div>':'') )}
function addSubject(existing=null){if(!isAdmin())return toast(t('adminSetup'));const s=existing||{};modal('<button class="close" onclick="closeModal()">×</button><h2>'+t(existing?'edit':'addSubject')+'</h2><div class="form"><input id="s_ar" value="'+esc(s.name_ar||'')+'" placeholder="'+t('nameAr')+'"><input id="s_en" value="'+esc(s.name_en||'')+'" placeholder="'+t('nameEn')+'"><input id="s_icon" value="'+esc(s.icon||'📚')+'" placeholder="📚"><button class="btn" onclick="saveSubject(\''+(s.id||'')+'\')">'+t('save')+'</button></div>')}
async function saveSubject(id){if(!isAdmin())return toast(t('adminSetup'));const row={name_ar:document.getElementById('s_ar').value.trim(),name_en:document.getElementById('s_en').value.trim(),icon:document.getElementById('s_icon').value.trim()||'📚',user_id:user.id};if(!row.name_ar&&!row.name_en)return toast('اكتب اسم المادة');try{if(id){await dbUpdate('subjects',id,{name_ar:row.name_ar,name_en:row.name_en,icon:row.icon})}else{row.sort_order=data.subjects.length;await dbInsert('subjects',row)}closeModal();await loadCloud()}catch(e){toast(e.message)}}
function addLecture(subjectId,existing=null){if(!isAdmin())return toast(t('adminSetup'));const l=existing||{};modal('<button class="close" onclick="closeModal()">×</button><h2>'+t(existing?'edit':'addLecture')+'</h2><div class="form"><input id="l_ar" value="'+esc(l.title_ar||'')+'" placeholder="'+t('titleAr')+'"><input id="l_en" value="'+esc(l.title_en||'')+'" placeholder="'+t('titleEn')+'"><textarea id="l_note" placeholder="'+t('noteAr')+'">'+esc(l.note_ar||'')+'</textarea><select id="l_status"><option value="not_started">'+t('not_started')+'</option><option value="studied">'+t('studied')+'</option><option value="review">'+t('reviewStatus')+'</option><option value="mastered">'+t('masteredStatus')+'</option></select><input id="l_file" class="file" type="file" accept="application/pdf,.pdf"><button class="btn" onclick="saveLecture(\''+(l.id||'')+'\',\''+(subjectId||l.subject_id||'')+'\')">'+t('upload')+'</button></div>');if(l.status)document.getElementById('l_status').value=l.status}
async function saveLecture(id,subjectId){if(!isAdmin())return toast(t('adminSetup'));const row={title_ar:document.getElementById('l_ar').value.trim(),title_en:document.getElementById('l_en').value.trim(),note_ar:document.getElementById('l_note').value,status:document.getElementById('l_status').value};if(!row.title_ar&&!row.title_en)return toast('اكتب عنوان المحاضرة');try{let lecture;if(id){lecture=await dbUpdate('lectures',id,row)}else{row.subject_id=subjectId;row.user_id=user.id;row.sort_order=data.lectures.filter(x=>x.subject_id===subjectId).length;lecture=await dbInsert('lectures',row)}const file=document.getElementById('l_file').files[0];if(file){const path=user.id+'/'+lecture.id+'-'+Date.now()+'.pdf';const up=await sb.storage.from(BUCKET).upload(path,file,{upsert:true,contentType:'application/pdf'});if(up.error)throw up.error;await dbUpdate('lectures',lecture.id,{file_path:path,file_name:file.name})}closeModal();await loadCloud()}catch(e){console.error(e);toast(e.message)}}
function editLecture(id){const l=data.lectures.find(x=>x.id===id);if(l)addLecture(l.subject_id,l)}
async function deleteLecture(id){if(!isAdmin())return toast(t('adminSetup'));if(!confirm('حذف المحاضرة؟'))return;try{await dbDelete('lectures',id);closeModal();await loadCloud()}catch(e){toast(e.message)}}
async function deleteSubject(id){if(!isAdmin())return toast(t('adminSetup'));if(!confirm('حذف المادة وكل محاضراتها؟'))return;try{await dbDelete('subjects',id);go('subjects');await loadCloud()}catch(e){toast(e.message)}}
async function downloadFile(path){const {data,error}=await sb.storage.from(BUCKET).createSignedUrl(path,3600);if(error)return toast(error.message);window.open(data.signedUrl,'_blank')}
async function dbInsert(table,row){const {data,error}=await sb.from(table).insert(row).select().single();if(error)throw error;return data}
async function dbUpdate(table,id,row){const {data,error}=await sb.from(table).update(row).eq('id',id).select().single();if(error)throw error;return data}
async function dbDelete(table,id){const {error}=await sb.from(table).delete().eq('id',id);if(error)throw error}
function searchPage(){shell(top(t('search'))+'<input id="q" class="search" oninput="doSearch()" placeholder="'+t('searchHint')+'"><div id="results" class="list" style="margin-top:15px"></div>');doSearch()}
function doSearch(){const q=(document.getElementById('q')?.value||'').toLowerCase();const r=data.lectures.filter(l=>(lecName(l)+' '+noteOf(l)).toLowerCase().includes(q)||nameOf(data.subjects.find(s=>s.id===l.subject_id)||{}).toLowerCase().includes(q));document.getElementById('results').innerHTML=r.length?r.map(lectureRow).join(''):'<div class="empty">'+t('noData')+'</div>'}
function simple(title,msg){shell(top(title)+ '<div class="empty">'+msg+'</div>')}
function settings(){shell(top(t('account'))+'<div class="card"><h2>'+esc(profile?.display_name||user?.email||'')+'</h2><p>'+esc(user?.email||'')+'</p><p>'+t('connection')+': <b>'+t('cloud')+'</b></p>'+(isAdmin()?'<p class="admin">'+t('admin')+'</p>':'<p class="muted">'+t('adminSetup')+'</p>')+'</div>')}
function go(p){page=p;if(p==='home')home();else if(p==='subjects')subjects();else if(p==='search')searchPage();else if(p==='settings')settings();else if(p==='review')simple(t('review'),'قسم المراجعة جاهز للتطوير التالي.');else if(p==='quiz')simple(t('quiz'),'قسم الاختبارات جاهز للتطوير التالي.')}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';go(page)}
window.addEventListener('load',()=>{if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});init()});
</script>
</body></html>
