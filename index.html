<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c86">
<title>مذاكرتي | منصة مذاكرة التمريض</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f3f7f8;--card:#fff;--tx:#14262b;--mu:#667b80;--ac:#0e7c86;--ac2:#14a0a8;--bd:#dde7e9;--ok:#1f9d63;--dg:#d64545;--sh:0 6px 24px rgba(14,60,70,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1719;--card:#152225;--tx:#e8f1f2;--mu:#8da4a8;--ac:#2bbfc9;--ac2:#4fd3dc;--bd:#25393d;--sh:0 6px 24px rgba(0,0,0,.35)}}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,system-ui,Tahoma,sans-serif;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:11px 13px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{min-height:110px;resize:vertical}
button{border:0;border-radius:12px;padding:10px 16px;background:var(--ac);color:#fff;font-weight:700;cursor:pointer;transition:.15s}
button:hover{filter:brightness(1.08)}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button.d{background:none;color:var(--dg);padding:6px 10px}
button.g{background:none;color:var(--mu);padding:6px 10px}
a{color:var(--ac)}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--bd);padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.top>div{max-width:900px;margin:auto;display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:20px;color:var(--ac);flex:1;cursor:pointer}
.nav{background:var(--card);border-bottom:1px solid var(--bd)}
.nav>div{max-width:900px;margin:auto;display:flex;padding:0 8px}
.nav a{flex:1;text-align:center;padding:11px 4px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--mu);font-size:14px}
.nav a:hover{color:var(--ac)}
.fc{min-height:190px;display:grid;place-items:center;text-align:center;font-size:22px;font-weight:700;padding:26px;cursor:pointer;user-select:none}
.fc.back{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0}
.opt{display:block;width:100%;text-align:right;background:var(--card);color:var(--tx);border:1px solid var(--bd);margin-top:10px;padding:13px 16px}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--dg);color:#fff;border-color:var(--dg)}
.wrap{max-width:900px;margin:auto;padding:18px 16px 60px}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:20px;padding:22px;box-shadow:var(--sh);margin-bottom:20px}
.hero h2{margin:0 0 4px;font-size:22px}.hero p{margin:0 0 14px;opacity:.9}
.hero .bar{background:rgba(255,255,255,.3)}.hero .bar i{background:#fff}
.bar{height:8px;border-radius:8px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:8px;transition:width .4s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.sub{cursor:pointer;transition:.15s}.sub:hover{transform:translateY(-3px);border-color:var(--ac)}
.sub .ic{font-size:32px}.sub h3{margin:8px 0 2px;font-size:17px}.sub small{color:var(--mu)}
.sub .bar{margin-top:12px}
h1.t{font-size:24px;margin:6px 0 16px}
.back{background:none;color:var(--ac);padding:4px 0;margin-bottom:6px}
.lec{display:flex;align-items:center;gap:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s}
.lec:hover{border-color:var(--ac)}
.lec .n{flex:1;font-weight:600}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--bd);display:grid;place-items:center;flex:none;color:#fff;font-size:14px}
.chk.on{background:var(--ok);border-color:var(--ok)}
.lk{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd)}
.lk:last-child{border:0}.lk a{flex:1;text-decoration:none;font-weight:600;overflow-wrap:anywhere}
.sec{margin:22px 0 8px;font-weight:800;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row>*{flex:1;min-width:130px}.row>button{flex:none}
.adm{border:1px dashed var(--ac);background:transparent;box-shadow:none;margin-top:14px}
.adm b{color:var(--ac)}
.auth{max-width:420px;margin:8vh auto;padding:0 16px}
.auth .card{padding:26px}.auth h1{margin:0 0 4px;color:var(--ac);font-size:28px}
.tabs{display:flex;gap:6px;margin:16px 0}.tabs button{flex:1}
.fld{margin-bottom:12px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:12px;z-index:20;max-width:90vw}
.empty{text-align:center;color:var(--mu);padding:30px 0}
.badge{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;color:var(--mu)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const SB_URL='https://glfjrtckirnmqfthshar.supabase.co';
const SB_KEY='sb_publishable_n0onfSqsF_9AVf8mmRhgEA_V8GVJMwT';
const sb=supabase.createClient(SB_URL,SB_KEY);
const KIND={video:'🎬 فيديو',pdf:'📄 PDF',recording:'🎧 تسجيل',summary:'📝 ملخص',other:'🔗 رابط'};
let me=null,prof=null,subjects=[],lectures=[],prog={},authMode='in',cards=[],qs=[],ci=0,flip=false,quiz=null;
const $=s=>document.querySelector(s);
const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isAdmin=()=>!!(prof&&prof.is_admin);
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3200)}
const fixUrl=u=>{u=(u||'').trim();return /^https?:\/\//i.test(u)?u:'https://'+u};
const go=h=>{location.hash='/'+h};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'){me=null;route()}});
  if(session){me=session.user;await loadAll()}
  route();
}
async function loadAll(){
  const [p,s,l,pr,fc,qq]=await Promise.all([
    sb.from('profiles').select('*').eq('id',me.id).maybeSingle(),
    sb.from('subjects').select('*').order('sort_order').order('created_at'),
    sb.from('lectures').select('*').order('sort_order').order('created_at'),
    sb.from('lecture_progress').select('*').eq('user_id',me.id),
    sb.from('flashcards').select('*').eq('user_id',me.id).order('created_at'),
    sb.from('questions').select('*').eq('user_id',me.id).order('created_at')]);
  cards=fc.data||[];qs=qq.data||[];
  prof=p.data;subjects=s.data||[];lectures=l.data||[];prog={};
  (pr.data||[]).forEach(r=>prog[r.lecture_id]=r);
}
window.addEventListener('hashchange',route);

function route(){
  if(!me){return authView()}
  const h=location.hash.replace('#/','').split('/');
  if(h[0]==='s'&&h[1])return subjectView(h[1]);
  if(h[0]==='l'&&h[1])return lectureView(h[1]);
  if(h[0]==='cards')return cardsView();
  if(h[0]==='quiz')return quizView();
  homeView();
}
function shell(inner){
  $('#app').innerHTML=`<div class="top"><div><span class="brand" data-a="home">📚 مذاكرتي</span><span class="badge">${e(prof?.display_name||'')}${isAdmin()?' · مشرف':''}</span><button class="g" data-a="out">خروج</button></div></div><div class="nav"><div><a data-a="open" data-h="">📚 المواد</a><a data-a="open" data-h="cards">🗂 البطاقات</a><a data-a="open" data-h="quiz">✅ الاختبار</a></div></div><div class="wrap">${inner}</div>`;
  window.scrollTo(0,0);
}
function authView(){
  const up=authMode==='up';
  $('#app').innerHTML=`<div class="auth"><div class="card"><h1>📚 مذاكرتي</h1><div style="color:var(--mu)">منصة مذاكرة طلبة التمريض: كل مادة بمحاضراتها في مكان واحد</div>
  <div class="tabs"><button class="${up?'s':''}" data-a="mode" data-m="in">تسجيل دخول</button><button class="${up?'':'s'}" data-a="mode" data-m="up">حساب جديد</button></div>
  ${up?'<div class="fld"><input id="nm" placeholder="الاسم"></div>':''}
  <div class="fld"><input id="em" type="email" dir="ltr" placeholder="البريد الإلكتروني"></div>
  <div class="fld"><input id="pw" type="password" dir="ltr" placeholder="كلمة المرور (٦ أحرف على الأقل)"></div>
  <button style="width:100%" data-a="auth">${up?'إنشاء الحساب':'دخول'}</button></div></div>`;
}
function stats(sid){
  const ls=lectures.filter(l=>l.subject_id===sid);
  const d=ls.filter(l=>prog[l.id]?.done).length;
  return {t:ls.length,d,p:ls.length?Math.round(d/ls.length*100):0};
}
function homeView(){
  const t=lectures.length,d=lectures.filter(l=>prog[l.id]?.done).length,p=t?Math.round(d/t*100):0;
  let h=`<div class="hero"><h2>أهلاً ${e(prof?.display_name||'')} 👋</h2><p>${t?`خلّصت ${d} من ${t} محاضرة`:'لسه مفيش محاضرات مضافة'}</p><div class="bar"><i style="width:${p}%"></i></div></div><h1 class="t">المواد</h1>`;
  if(!subjects.length)h+='<div class="empty">لسه مفيش مواد.</div>';
  h+='<div class="grid">'+subjects.map(s=>{const k=stats(s.id);return `<div class="card sub" data-a="open" data-h="s/${s.id}"><div class="ic">${e(s.icon||'📚')}</div><h3>${e(s.name_ar)}</h3><small>${k.d}/${k.t} محاضرة · ${k.p}%</small><div class="bar"><i style="width:${k.p}%"></i></div></div>`}).join('')+'</div>';
  if(isAdmin())h+=`<div class="card adm"><b>إضافة مادة</b><div class="row"><input id="sn" placeholder="اسم المادة"><input id="si" placeholder="أيقونة" value="🩺" style="max-width:90px;min-width:70px"><button data-a="addS">إضافة</button></div></div>`;
  shell(h);
}
function subjectView(id){
  const s=subjects.find(x=>x.id===id);if(!s)return go('');
  const ls=lectures.filter(l=>l.subject_id===id),k=stats(id);
  let h=`<button class="back" data-a="home">← كل المواد</button><h1 class="t">${e(s.icon||'')} ${e(s.name_ar)}</h1><div class="bar" style="margin-bottom:18px"><i style="width:${k.p}%"></i></div>`;
  if(!ls.length)h+='<div class="empty">لسه مفيش محاضرات في المادة دي.</div>';
  h+=ls.map((l,i)=>`<div class="card lec" data-a="open" data-h="l/${l.id}"><div class="chk ${prog[l.id]?.done?'on':''}">${prog[l.id]?.done?'✓':''}</div><div class="n">${i+1}. ${e(l.title_ar)}</div><span class="g">‹</span></div>`).join('');
  if(isAdmin())h+=`<div class="card adm"><b>إضافة محاضرة</b><div class="row"><input id="ln" placeholder="عنوان المحاضرة"><button data-a="addL" data-s="${id}">إضافة</button></div><div class="row"><button class="d" data-a="delS" data-s="${id}">حذف المادة</button></div></div>`;
  shell(h);
}
async function lectureView(id){
  const l=lectures.find(x=>x.id===id);if(!l)return go('');
  const {data:links}=await sb.from('lecture_links').select('*').eq('lecture_id',id).order('sort_order').order('created_at');
  const pr=prog[id]||{},done=!!pr.done;
  let h=`<button class="back" data-a="open" data-h="s/${l.subject_id}">← رجوع للمادة</button><h1 class="t">${e(l.title_ar)}</h1>
  <button data-a="done" data-l="${id}" style="${done?'background:var(--ok)':''}">${done?'✓ تمت المذاكرة':'علّم إنها تمت'}</button>
  <div class="sec">المحتوى</div><div class="card">`;
  let any=false;
  if(l.file_path){any=true;h+=`<div class="lk"><span>📎</span><a href="#" data-a="file" data-p="${e(l.file_path)}">${e(l.file_name||'الملف المرفق')}</a>${isAdmin()?`<button class="d" data-a="delF" data-l="${id}">✕</button>`:''}</div>`}
  (links||[]).forEach(k=>{any=true;h+=`<div class="lk"><span>${KIND[k.kind]||KIND.other}</span><a href="${e(k.url)}" target="_blank" rel="noopener noreferrer">${e(k.title||k.url)}</a>${isAdmin()?`<button class="d" data-a="delK" data-k="${k.id}" data-l="${id}">✕</button>`:''}</div>`});
  if(!any)h+='<div class="empty" style="padding:10px">لسه مفيش محتوى.</div>';
  h+=`</div><div class="sec">ملاحظاتي</div><textarea id="note" placeholder="اكتب ملاحظاتك الخاصة هنا، محدش غيرك بيشوفها...">${e(pr.note||'')}</textarea><div class="row"><button class="s" data-a="note" data-l="${id}">حفظ الملاحظات</button></div>`;
  if(isAdmin())h+=`<div class="card adm"><b>إضافة محتوى للمحاضرة</b>
  <div class="row"><select id="lk">${Object.entries(KIND).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><input id="lt" placeholder="العنوان"></div>
  <div class="row"><input id="lu" dir="ltr" placeholder="https://..."><button data-a="addK" data-l="${id}">إضافة رابط</button></div>
  <div class="row"><input id="lf" type="file"><button data-a="up" data-l="${id}">رفع ملف</button></div>
  <div class="row"><button class="d" data-a="delL" data-l="${id}" data-s="${l.subject_id}">حذف المحاضرة</button></div></div>`;
  shell(h);
}

function cardsView(){
  let h='<h1 class="t">بطاقات المراجعة</h1>';
  if(!cards.length)h+='<div class="empty">لسه مفيش بطاقات. أضف أول بطاقة من تحت.</div>';
  else{
    if(ci>=cards.length)ci=0;const c=cards[ci];
    h+=`<div class="card fc ${flip?'back':''}" data-a="flip">${e(flip?c.back_ar:c.front_ar)}</div>
    <div class="row" style="justify-content:center"><button class="s" data-a="cprev">السابقة</button><span class="badge" style="align-self:center;flex:none;min-width:0">${ci+1} / ${cards.length}</span><button class="s" data-a="cnext">التالية</button></div>
    <div class="row"><button class="d" data-a="delC" data-id="${c.id}">حذف البطاقة دي</button></div>`;
  }
  h+=`<div class="card adm"><b>إضافة بطاقة</b><div class="row"><input id="cf" placeholder="السؤال / المصطلح"></div><div class="row"><input id="cb" placeholder="الإجابة"><button data-a="addC">إضافة</button></div></div>`;
  shell(h);
}
function quizView(){
  let h='<h1 class="t">اختبر نفسك</h1>';
  if(quiz&&quiz.i<quiz.o.length){
    const q=qs[quiz.o[quiz.i]],opts=q.options_ar||[];
    h+=`<div class="badge">سؤال ${quiz.i+1} من ${quiz.o.length}</div><div class="card" style="margin-top:10px;font-size:18px;font-weight:700">${e(q.question_ar)}</div>`;
    opts.forEach((o,i)=>{
      let c='';if(quiz.a!==null){if(i===q.answer_index)c='ok';else if(i===quiz.a)c='no'}
      h+=`<button class="opt ${c}" data-a="pick" data-i="${i}">${e(o)}</button>`;
    });
    if(quiz.a!==null)h+=`<div class="row"><button data-a="qnext">${quiz.i+1<quiz.o.length?'السؤال التالي':'عرض النتيجة'}</button></div>`;
  }else if(quiz){
    const p=Math.round(quiz.s/quiz.o.length*100);
    h+=`<div class="hero"><h2>النتيجة: ${quiz.s} من ${quiz.o.length}</h2><p>${p>=80?'ممتاز 👏':p>=50?'كويس، كمّل مراجعة 💪':'محتاج مراجعة أكتر، وإنت قدها 🌱'}</p></div><div class="row"><button data-a="qstart">إعادة الاختبار</button><button class="s" data-a="qstop">رجوع</button></div>`;
  }else{
    h+=qs.length?`<div class="card"><p>عندك ${qs.length} سؤال.</p><button data-a="qstart">ابدأ الاختبار</button></div>`:'<div class="empty">لسه مفيش أسئلة. أضف أسئلتك من تحت.</div>';
    h+=`<div class="sec">أسئلتي</div>`+qs.map(q=>`<div class="card lec" style="cursor:default"><div class="n">${e(q.question_ar)}</div><button class="d" data-a="delQ" data-id="${q.id}">✕</button></div>`).join('');
    h+=`<div class="card adm"><b>إضافة سؤال</b><div class="row"><input id="qq" placeholder="نص السؤال"></div>
    <div class="row"><input class="qo" placeholder="الاختيار ١"><input class="qo" placeholder="الاختيار ٢"></div><div class="row"><input class="qo" placeholder="الاختيار ٣"><input class="qo" placeholder="الاختيار ٤"></div>
    <div class="row"><select id="qa"><option value="0">الإجابة الصح: ١</option><option value="1">الإجابة الصح: ٢</option><option value="2">الإجابة الصح: ٣</option><option value="3">الإجابة الصح: ٤</option></select><button data-a="addQ">إضافة</button></div></div>`;
  }
  shell(h);
}
async function saveProg(lid,patch){
  const cur=prog[lid]||{done:false,note:''};
  const row={user_id:me.id,lecture_id:lid,done:cur.done,note:cur.note,...patch,updated_at:new Date().toISOString()};
  const {error}=await sb.from('lecture_progress').upsert(row);
  if(error)return toast('حصل خطأ: '+error.message),false;
  prog[lid]=row;return true;
}
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,d=b.dataset;
  if(a==='file')ev.preventDefault();
  try{
  if(a==='home')go('');
  else if(a==='open')go(d.h);
  else if(a==='mode'){authMode=d.m;authView()}
  else if(a==='out'){await sb.auth.signOut();me=null;prof=null;quiz=null;subjects=[];lectures=[];prog={};cards=[];qs=[];go('');route()}
  else if(a==='auth'){
    const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||!pw)return toast('اكتب البريد وكلمة المرور');
    if(authMode==='up'){
      const {data,error}=await sb.auth.signUp({email:em,password:pw,options:{data:{display_name:($('#nm')?.value||'').trim()}}});
      if(error)return toast(error.message);
      if(!data.session)return toast('تم إنشاء الحساب. افتح بريدك وأكّد الحساب ثم سجّل دخول.');
      me=data.user;
    }else{
      const {data,error}=await sb.auth.signInWithPassword({email:em,password:pw});
      if(error)return toast('البريد أو كلمة المرور غير صحيحة');
      me=data.user;
    }
    await loadAll();go('');route();
  }
  else if(a==='flip'){flip=!flip;cardsView()}
  else if(a==='cnext'){ci=(ci+1)%cards.length;flip=false;cardsView()}
  else if(a==='cprev'){ci=(ci-1+cards.length)%cards.length;flip=false;cardsView()}
  else if(a==='addC'){const f=$('#cf').value.trim(),bk=$('#cb').value.trim();if(!f||!bk)return toast('اكتب السؤال والإجابة');const {error}=await sb.from('flashcards').insert({user_id:me.id,front_ar:f,back_ar:bk});if(error)return toast(error.message);await loadAll();ci=cards.length-1;flip=false;cardsView()}
  else if(a==='delC'){if(!confirm('حذف البطاقة؟'))return;await sb.from('flashcards').delete().eq('id',d.id);await loadAll();ci=0;flip=false;cardsView()}
  else if(a==='addQ'){
    const q=$('#qq').value.trim(),o=[...document.querySelectorAll('.qo')].map(x=>x.value.trim());
    if(!q||o.some(x=>!x))return toast('اكتب السؤال والأربع اختيارات');
    const {error}=await sb.from('questions').insert({user_id:me.id,question_ar:q,options_ar:o,answer_index:+$('#qa').value});
    if(error)return toast(error.message);await loadAll();quizView();
  }
  else if(a==='delQ'){if(!confirm('حذف السؤال؟'))return;await sb.from('questions').delete().eq('id',d.id);await loadAll();quizView()}
  else if(a==='qstart'){const o=qs.map((_,i)=>i).sort(()=>Math.random()-.5);quiz={o,i:0,s:0,a:null};quizView()}
  else if(a==='pick'){if(quiz.a!==null)return;quiz.a=+d.i;if(quiz.a===qs[quiz.o[quiz.i]].answer_index)quiz.s++;quizView()}
  else if(a==='qnext'){quiz.i++;quiz.a=null;quizView()}
  else if(a==='qstop'){quiz=null;quizView()}
  else if(a==='done'){const ok=await saveProg(d.l,{done:!(prog[d.l]?.done)});if(ok)lectureView(d.l)}
  else if(a==='note'){if(await saveProg(d.l,{note:$('#note').value}))toast('تم الحفظ ✓')}
  else if(a==='file'){const {data,error}=await sb.storage.from('lecture-files').createSignedUrl(d.p,300);if(error)return toast('تعذّر فتح الملف');window.open(data.signedUrl,'_blank')}
  else if(isAdmin()){
    if(a==='addS'){const n=$('#sn').value.trim();if(!n)return;const {error}=await sb.from('subjects').insert({name_ar:n,icon:$('#si').value||'📚',user_id:me.id,sort_order:subjects.length});if(error)return toast(error.message);await loadAll();homeView()}
    else if(a==='addL'){const n=$('#ln').value.trim();if(!n)return;const {error}=await sb.from('lectures').insert({title_ar:n,subject_id:d.s,user_id:me.id,sort_order:lectures.filter(x=>x.subject_id===d.s).length});if(error)return toast(error.message);await loadAll();subjectView(d.s)}
    else if(a==='addK'){const u=$('#lu').value;if(!u.trim())return;const {error}=await sb.from('lecture_links').insert({lecture_id:d.l,kind:$('#lk').value,title:$('#lt').value.trim(),url:fixUrl(u)});if(error)return toast(error.message);lectureView(d.l)}
    else if(a==='delK'){if(!confirm('حذف الرابط؟'))return;await sb.from('lecture_links').delete().eq('id',d.k);lectureView(d.l)}
    else if(a==='up'){
      const f=$('#lf').files[0];if(!f)return toast('اختار ملف الأول');
      const ext=(f.name.split('.').pop()||'bin').replace(/[^a-z0-9]/gi,'').slice(0,8)||'bin';
      const path=`${d.l}/${Date.now()}.${ext}`;toast('جاري الرفع...');
      const {error}=await sb.storage.from('lecture-files').upload(path,f);if(error)return toast(error.message);
      await sb.from('lectures').update({file_path:path,file_name:f.name}).eq('id',d.l);
      await loadAll();lectureView(d.l);
    }
    else if(a==='delF'){if(!confirm('إزالة الملف؟'))return;const l=lectures.find(x=>x.id===d.l);if(l?.file_path)await sb.storage.from('lecture-files').remove([l.file_path]);await sb.from('lectures').update({file_path:null,file_name:null}).eq('id',d.l);await loadAll();lectureView(d.l)}
    else if(a==='delL'){if(!confirm('حذف المحاضرة وكل محتواها؟'))return;await sb.from('lectures').delete().eq('id',d.l);await loadAll();go('s/'+d.s)}
    else if(a==='delS'){if(!confirm('حذف المادة وكل محاضراتها؟'))return;await sb.from('lectures').delete().eq('subject_id',d.s);await sb.from('subjects').delete().eq('id',d.s);await loadAll();go('')}
  }
  }catch(err){toast('حصل خطأ، جرّب تاني')}
});
boot();
</script>
</body>
</html>
